name: Validate SocialCert backend
on:
  pull_request:
  push:
    branches-ignore: [master, production]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          SOCIALCERT_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      - run: npm run build
      - name: Validate isolated image build
        run: docker build --platform linux/amd64 --provenance=false -t socialcert-backend-check .
      - name: Validate release scripts and routing ownership
        run: |
          bash -n scripts/k8s/build-local-image.sh scripts/k8s/deploy-local.sh
          if grep -R -E 'kind: Ingress|ingressClassName: nginx' infra/kubernetes; then
            echo 'Application releases must not recreate retired Ingress resources.'
            exit 1
          fi
